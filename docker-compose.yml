version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dorm_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_bot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      GROUP_ID: ${GROUP_ID}
      DATABASE_URL: postgres://dorm:password@postgres:5432/dorm_bot?sslmode=disable
    restart: always

volumes:
  postgres_data: