version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dorm-bot-db
    environment:
      POSTGRES_DB: dorm_bot
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dorm-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dorm-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dorm:${DB_PASSWORD:-password}@postgres:5432/dorm_bot?sslmode=disable
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      GROUP_IDS: ${GROUP_IDS}
    restart: always
    networks:
      - dorm-network
    volumes:
      - ./config/config.yml:/app/config/config.yml

volumes:
  postgres_data:

networks:
  dorm-network:
    driver: bridge
